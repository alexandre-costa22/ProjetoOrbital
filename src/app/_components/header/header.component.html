<header class="fixed-top bg-black">
  <div class="container">
    <div class="desktop-header d-none d-lg-flex justify-content-between align-items-center py-2">
      <div class="d-flex align-items-center gap-3" style="flex: 1;">
        <div class="dropdown">
          <button class="btn btn-black text-white fw-bold dropdown-toggle" type="button" data-bs-toggle="dropdown">
            Explorar
          </button>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" routerLink="/missions">Missões</a></li>
            <li><a class="dropdown-item" routerLink="/spaceships">Astronaves</a></li>
            <li><a class="dropdown-item" routerLink="/astronauts">Astronautas</a></li>
          </ul>
        </div>
      </div>

      <div class="px-4">
        <a routerLink="/">
          <img src="assets/icons/orbitalIcon.jpeg" width="50" height="50" class="rounded-circle" style="object-fit: cover;" alt="Logo Orbital">
        </a>
      </div>

      <div class="d-flex justify-content-end" style="flex: 1;">
        <ul class="nav align-items-center gap-3 mb-0 flex-nowrap">
          <li><a routerLink="/missions" class="text-white fw-semibold nav-link">Missões</a></li>
          <li><a routerLink="/spaceships" class="text-white fw-semibold nav-link">Astronaves</a></li>
          <li><a routerLink="/astronauts" class="text-white fw-semibold nav-link">Astronautas</a></li>
          <li>
            <a routerLink="/orbital-plus" class="text-white fw-semibold nav-link d-flex align-items-center gap-1" style="color: red !important;">
              Orbital+ <span style="margin-top: -15px; font-size: 10px; margin-left: -10px;" class="badge bg-danger text-white small">LIVE</span>
            </a>
          </li>
          <li *ngIf="isAuth" class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" role="button" data-bs-toggle="dropdown">
              Olá, {{ currentUser?.email }}
            </a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
              <li><a class="dropdown-item" routerLink="/favoriteItems">Favoritos</a></li>
              <li><a class="dropdown-item" routerLink="/userSettings">Configurações</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" type="button" (click)="logOut()">Sair</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <div class="mobile-header d-flex d-lg-none justify-content-between align-items-center">
      <div style="width: 49px;"></div>
      <a routerLink="/">
        <img src="assets/icons/orbitalIcon.jpeg" width="50" height="50" class="rounded-circle" style="object-fit: cover;" alt="Logo Orbital">
      </a>
      <button class="btn-icon" (click)="toggleMenu()">
        <i class="bi bi-list"></i>
      </button>
    </div>

  </div>
</header>

<div class="menu-overlay d-lg-none" [class.show]="isMenuOpen">
  <div class="menu-header container d-flex justify-content-between align-items-center">
    <div style="width: 49px;"></div>
    <a routerLink="/" (click)="closeMenuAndNavigate()">
      <img src="assets/icons/orbitalIcon.jpeg" width="50" height="50" class="rounded-circle" alt="Logo Orbital">
    </a>
    <button class="btn-icon" (click)="toggleMenu()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <nav class="menu-nav container">
    <a class="nav-item" routerLink="/missions" (click)="closeMenuAndNavigate()"><span>Missões</span> <i class="bi bi-chevron-right"></i></a>
    <a class="nav-item" routerLink="/spaceships" (click)="closeMenuAndNavigate()"><span>Astronaves</span> <i class="bi bi-chevron-right"></i></a>
    <a class="nav-item" routerLink="/astronauts" (click)="closeMenuAndNavigate()"><span>Astronautas</span> <i class="bi bi-chevron-right"></i></a>
    <hr class="nav-divider">
    <div *ngIf="isAuth">
      <a class="nav-item" routerLink="/favoriteItems" (click)="closeMenuAndNavigate()"><span>Favoritos</span> <i class="bi bi-chevron-right"></i></a>
      <a class="nav-item" routerLink="/userSettings" (click)="closeMenuAndNavigate()"><span>Configurações</span> <i class="bi bi-chevron-right"></i></a>
      <a class="nav-item" (click)="logOutAndCloseMenu()"><span>Sair</span> <i class="bi bi-chevron-right"></i></a>
      <hr class="nav-divider">
    </div>
    <a class="nav-item" routerLink="/orbital-plus" (click)="closeMenuAndNavigate()">
        <span class="d-flex align-items-center gap-2">Orbital+ <span class="badge bg-danger">LIVE</span></span>
        <i class="bi bi-chevron-right"></i>
    </a>
  </nav>
</div>
