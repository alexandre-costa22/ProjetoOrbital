<div *ngIf="isLoading" class="loader-container">
  <mat-spinner></mat-spinner>
</div>

<main *ngIf="!isLoading">
  <div class="bg-black py-5">
    <div class="container text-center">
      <h1 class="display-5 fst-italic text-white">CONFIGURAÇÕES DA CONTA</h1>
      <p class="lead text-white-50">Edite os seus dados e altere a sua senha.</p>
    </div>
  </div>

  <div class="settings-container bg-light py-5">
    <div class="container">
      <div *ngIf="userProfile" class="row g-4 justify-content-center">

        <div class="col-lg-5">
          <div class="settings-card">
            <h2>Dados Pessoais</h2>
            <hr>
            <form #settingsForm="ngForm" (ngSubmit)="saveSettings()">
              <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" class="form-control" [(ngModel)]="userProfile.name" required>
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" [(ngModel)]="userProfile.email" disabled>
              </div>
              <div class="form-group">
                <label for="birthDate">Data de Nascimento</label>
                <input type="text" id="birthDate" name="birthDate" class="form-control" [value]="userProfile.birthDate | date:'dd/MM/yyyy'" disabled>
              </div>
              <button type="submit" class="btn btn-action mt-3" [disabled]="!settingsForm.valid">Salvar Dados</button>
              <div *ngIf="profileSuccessMessage" class="alert-message success mt-3">{{ profileSuccessMessage }}</div>
              <div *ngIf="profileErrorMessage" class="alert-message error mt-3">{{ profileErrorMessage }}</div>
            </form>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="settings-card">
            <h2>Alterar Senha</h2>
            <hr>
            <form #passwordForm="ngForm" (ngSubmit)="changePassword()">
              <div class="form-group">
                <label for="currentPassword">Senha Atual</label>
                <input type="password" id="currentPassword" name="currentPassword" class="form-control" [(ngModel)]="passwordData.currentPassword" required>
              </div>
              <div class="form-group">
                <label for="newPassword">Nova Senha</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" [(ngModel)]="passwordData.newPassword" required minlength="6">
              </div>
              <div class="form-group">
                <label for="confirmPassword">Confirmar Nova Senha</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" [(ngModel)]="passwordData.confirmPassword" required>
              </div>
              <button type="submit" class="btn btn-action mt-3" [disabled]="!passwordForm.valid">Alterar Senha</button>
              <div *ngIf="passwordSuccessMessage" class="alert-message success mt-3">{{ passwordSuccessMessage }}</div>
              <div *ngIf="passwordErrorMessage" class="alert-message error mt-3">{{ passwordErrorMessage }}</div>
            </form>
          </div>
        </div>

      </div>

      <div *ngIf="!userProfile && !isLoading" class="text-center text-muted">
        <p>Não foi possível carregar os seus dados.</p>
      </div>
    </div>
  </div>
</main>
