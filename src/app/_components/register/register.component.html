<div class="container">
  <div class="left-side">
    <img src="assets/images/auth/moonLandingLoginPage.jpeg" alt="Register Image" />
  </div>

  <div class="right-side">
    <h1>Cadastre-se</h1>
    <p>Digite os seus dados para criar uma conta.</p>

    <form class="formLogin" (submit)="createUser(); $event.preventDefault()">
      
      <label for="name">Nome completo</label>
      <input
        id="name"
        name="name"
        [(ngModel)]="usuario.name"
        type="text"
        placeholder="Digite seu nome completo"
        autofocus
      />

      <label for="birthDate">Data de nascimento</label>
      <input
        id="birthDate"
        name="birthDate"
        [(ngModel)]="usuario.birthDate"
        type="date"
      />

      <label for="email">E-mail</label>
      <input
        autocomplete="on"
        id="email"
        name="email"
        [(ngModel)]="usuario.email"
        type="email"
        placeholder="Digite seu e-mail"
      />

      <label for="password">Senha</label>
      <input
        id="password"
        name="password"
        [(ngModel)]="usuario.senha"
        type="password"
        placeholder="Digite sua senha"
      />

      <button type="submit" class="btn-login">Cadastrar</button> 
      <a routerLink="/login" class="register-link">Fazer login</a>

    </form>
  </div>
</div>
