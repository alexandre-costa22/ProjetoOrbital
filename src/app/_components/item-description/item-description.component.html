<div *ngIf="isLoading" class="loader-container uploader-status">
  <mat-spinner></mat-spinner>
</div>
<div *ngIf="!isLoading">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-4 text-center">
        <img [src]="srcImg" alt="Imagem do item" class="img-fluid rounded" />
        <button class="btn btn-outline-dark mt-3" style="margin-right: 10px; border: none;" (click)="redirecionarParaAcervoNasa(name)">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
            <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/>
          </svg>
        </button>
        <button 
        class="btn btn-outline-dark mt-3" 
        [ngClass]="{'active': isFavorited()}" 
        (click)="toggleFavorite()" 
        style="border: none;"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" 
             fill="currentColor" class="bi bi-bookmark-star-fill" 
             viewBox="0 0 16 16">
          <path fill-rule="evenodd" 
                d="M2 15.5V2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.74.439L8 13.069l-5.26 2.87A.5.5 0 0 1 2 15.5M8.16 4.1a.178.178 0 0 0-.32 0l-.634 1.285a.18.18 0 0 1-.134.098l-1.42.206a.178.178 0 0 0-.098.303L6.58 6.993c.042.041.061.1.051.158L6.39 8.565a.178.178 0 0 0 .258.187l1.27-.668a.18.18 0 0 1 .165 0l1.27.668a.178.178 0 0 0 .257-.187L9.368 7.15a.18.18 0 0 1 .05-.158l1.028-1.001a.178.178 0 0 0-.098-.303l-1.42-.206a.18.18 0 0 1-.134-.098z"/>
        </svg>
      </button>
      
      </div>
  
      <div class="col-md-8">
        <div [innerHTML]="description"></div>
      </div>
    </div>
  </div>
  <br>
  <app-missions
    [isMainMissionPage]="false"
  ></app-missions>
</div>
